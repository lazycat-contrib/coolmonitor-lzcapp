application:
  subdomain: coolmonitor
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://coolmonitor:3333/
services:
  coolmonitor:
    # upstream: docker.io/star7th/coolmonitor:latest@sha256:64f83e368aba323b64796bc206a71efabc815d75f2eb3699592c94296dc6e2d9
    image: registry.lazycat.cloud/czyt/star7th/coolmonitor:eef6035308dbfe6d
    environment:
      - NODE_ENV=production
      - PORT=3333
      - DOCKER_SETUP=true
    binds:
      - /lzcapp/var/data:/app/data
