application:
  subdomain: coolmonitor
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://coolmonitor:3333/
services:
  coolmonitor:
    # upstream: docker.io/star7th/coolmonitor:latest@sha256:51bf44d2d513ca8ca39ac8220add43556952101f72958a9ba2f601a2299d153e
    image: registry.lazycat.cloud/czyt/star7th/coolmonitor:6e29fa1c2a383f85
    environment:
      - NODE_ENV=production
      - PORT=3333
      - DOCKER_SETUP=true
    binds:
      - /lzcapp/var/data:/app/data
