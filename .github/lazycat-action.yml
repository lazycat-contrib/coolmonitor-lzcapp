version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/coolmonitor.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: coolmonitor
    bump: patch

build:
  run_buildscript: false

images:
  - id: coolmonitor
    target: service
    service: coolmonitor
    source: docker.io/star7th/coolmonitor
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    application:
      language: zh
      name: coolmonitor
      source: https://github.com/star7th/coolmonitor
      source_author: star7th
  private:
    enabled: true
    skip_if_version_exists: true
    name: coolmonitor
    summary: coolmonitor 的 LazyCat 自动构建版本
